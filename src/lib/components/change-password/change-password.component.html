<div class="dwa-page">
  <div class="dwa-container dwa-stack">
    @if (showHeader()) {
      <dwa-page-header
        [eyebrow]="eyebrow()"
        [title]="title()"
        [description]="description()"
        [backLink]="userDataBasePath"
      />
    }

    <form class="dwa-card dwa-form" (ngSubmit)="submitChangePassword()">
      <div class="dwa-card__head">
        <div class="dwa-card__icon dwa-card__icon--security">
          <i class="fa-solid fa-lock"></i>
        </div>
        <div>
          <span class="dwa-card__eyebrow">Credenciais</span>
          <h2 class="dwa-card__title">Nova Senha</h2>
        </div>
      </div>

      <div class="dwa-password-fields">
        <div class="dwa-password-field">
          <ds-input
            [type]="showCurrentPassword ? 'text' : 'password'"
            label="Senha atual"
            placeholder="Digite sua senha atual"
            [required]="true"
            [value]="currentPassword()"
            (valueChange)="currentPassword.set($event)"
          />
          <button
            type="button"
            class="dwa-password-toggle"
            (click)="showCurrentPassword = !showCurrentPassword"
            [title]="showCurrentPassword ? 'Ocultar senha' : 'Ver senha'"
          >
            <i class="fa-solid {{ showCurrentPassword ? 'fa-eye-slash' : 'fa-eye' }}"></i>
          </button>
        </div>

        <div class="dwa-password-field">
          <ds-input
            [type]="showNewPassword ? 'text' : 'password'"
            label="Nova senha"
            placeholder="Mínimo de 6 caracteres"
            [required]="true"
            [value]="newPassword()"
            (valueChange)="newPassword.set($event)"
          />
          <button
            type="button"
            class="dwa-password-toggle"
            (click)="showNewPassword = !showNewPassword"
            [title]="showNewPassword ? 'Ocultar senha' : 'Ver senha'"
          >
            <i class="fa-solid {{ showNewPassword ? 'fa-eye-slash' : 'fa-eye' }}"></i>
          </button>
        </div>

        <div class="dwa-password-field">
          <ds-input
            [type]="showConfirmPassword ? 'text' : 'password'"
            label="Confirmar nova senha"
            placeholder="Repita a nova senha"
            [required]="true"
            [value]="confirmPassword()"
            (valueChange)="confirmPassword.set($event)"
          />
          <button
            type="button"
            class="dwa-password-toggle"
            (click)="showConfirmPassword = !showConfirmPassword"
            [title]="showConfirmPassword ? 'Ocultar senha' : 'Ver senha'"
          >
            <i class="fa-solid {{ showConfirmPassword ? 'fa-eye-slash' : 'fa-eye' }}"></i>
          </button>
        </div>

        @if (passwordMismatch()) {
          <div class="dwa-note dwa-note--danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>As senhas digitadas não coincidem.</p>
          </div>
        }
      </div>

      <div class="dwa-form-actions">
        <ds-button
          variant="ghost"
          type="button"
          [disabled]="changingPassword()"
          (click)="goBack()"
        >
          Cancelar
        </ds-button>

        <ds-button
          variant="primary"
          type="submit"
          [loading]="changingPassword()"
          [disabled]="changingPassword() || !isPasswordFormValid()"
        >
          <i class="fa-solid fa-key me-2"></i>
          <span>Confirmar alteração</span>
        </ds-button>
      </div>
    </form>
  </div>
</div>
