<div
  class="dwa-login-viewport"
  [class.dwa-theme-light]="isLight()"
  [class.dwa-theme-dark]="isDark()"
  [class.dwa-theme-glass]="isGlass()"
  [class.dwa-btn-pill]="resolvedButtonPill()"
  [ngClass]="customClass || config.customClass"
  [style.--dwa-custom-bg]="resolvedBackground()"
  [style.--dwa-brand-gradient]="resolvedBrandGradient()"
  [style.--dwa-brand-color]="resolvedBrandColor()"
  [style.--dwa-card-radius]="resolvedCardRadius()"
  [style.--dwa-card-max-width]="resolvedCardMaxWidth()"
>
  <!-- Barra Superior / Seletor de Tema (opcional) -->
  <aside *ngIf="resolvedShowThemeToggle()" class="dwa-theme-toggle-bar">
    <button
      type="button"
      class="dwa-theme-pill-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Alternar para tema claro' : 'Alternar para tema escuro'"
      title="Alternar tema"
    >
      <span class="dwa-pill-opt" [class.active]="isLight()">
        <i class="fa-solid fa-sun"></i> Light
      </span>
      <span class="dwa-pill-opt" [class.active]="isDark()">
        <i class="fa-solid fa-moon"></i> Dark
      </span>
    </button>
  </aside>

  <!-- Efeito Aurora e Luz de Fundo (se habilitado) -->
  <div *ngIf="resolvedShowAurora()" class="dwa-aurora-wrap" aria-hidden="true">
    <div class="dwa-aurora dwa-aurora-primary"></div>
    <div class="dwa-aurora dwa-aurora-accent"></div>
  </div>

  <div class="dwa-login-container">
    <!-- Slot customizado antes do card -->
    <ng-content select="[loginHeader]"></ng-content>

    <!-- Card Principal de Login -->
    <div class="dwa-login-card">
      <!-- Cabeçalho / Identidade Visual -->
      <div class="dwa-card-header">
        <div class="dwa-brand-icon-wrap" [class.dwa-brand-has-image]="!!resolvedLogoUrl()">
          <img
            *ngIf="resolvedLogoUrl(); else fontAwesomeIconTpl"
            [src]="resolvedLogoUrl()"
            [alt]="resolvedLogoAlt()"
            class="dwa-brand-logo-img"
          />
          <ng-template #fontAwesomeIconTpl>
            <i [class]="resolvedAppIcon()" class="dwa-brand-icon"></i>
          </ng-template>
        </div>
        <h1 class="dwa-brand-title">{{ resolvedAppTitle() }}</h1>
        <p class="dwa-brand-subtitle">{{ resolvedAppSubtitle() }}</p>
      </div>

      <!-- Banner de Erro -->
      <div *ngIf="errorMessage()" class="dwa-error-banner" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Formulário de Login -->
      <form (ngSubmit)="onSubmit()" class="dwa-login-form" autocomplete="on">
        <div class="dwa-field-group">
          <ds-input
            label="E-mail de acesso"
            type="email"
            inputId="dwa-login-email"
            autocomplete="email"
            placeholder="seu.email@empresa.com"
            [required]="true"
            [value]="email()"
            (valueChange)="email.set($event)"
          ></ds-input>
        </div>

        <div class="dwa-field-group dwa-password-group">
          <ds-input
            label="Senha"
            [type]="showPass() ? 'text' : 'password'"
            inputId="dwa-login-password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            [required]="true"
            [value]="password()"
            (valueChange)="password.set($event)"
          ></ds-input>
          <button
            type="button"
            class="dwa-password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPass() ? 'Ocultar senha' : 'Exibir senha'"
            tabindex="-1"
          >
            <i class="fa-solid" [class.fa-eye]="!showPass()" [class.fa-eye-slash]="showPass()"></i>
          </button>
        </div>

        <div class="dwa-form-options">
          <label *ngIf="showRememberMe" class="dwa-remember-me">
            <input
              type="checkbox"
              [checked]="remember()"
              (change)="remember.set($any($event.target).checked)"
            />
            <span class="dwa-checkbox-custom"></span>
            <span class="dwa-checkbox-label">{{ labels.loginRememberMe }}</span>
          </label>

          <a
            *ngIf="forgotPasswordUrl"
            [routerLink]="forgotPasswordUrl"
            class="dwa-forgot-link"
          >
            {{ labels.loginForgotPassword }}
          </a>
        </div>

        <div class="dwa-form-actions">
          <ds-button
            variant="primary"
            size="lg"
            [fullWidth]="true"
            [loading]="loading()"
            type="submit"
            class="dwa-submit-btn"
          >
            {{ loading() ? 'Autenticando...' : labels.loginSubmitBtn }}
          </ds-button>
        </div>

        <!-- Slot customizado dentro do formulário -->
        <ng-content select="[loginExtra]"></ng-content>
      </form>

      <!-- Rodapé do Card -->
      <div *ngIf="registerUrl" class="dwa-card-footer">
        <span class="dwa-footer-text">Não tem uma conta?</span>
        <a [routerLink]="registerUrl" class="dwa-footer-link">Criar conta</a>
      </div>
    </div>

    <!-- Slot customizado após o card -->
    <ng-content select="[loginFooter]"></ng-content>

    <!-- Rodapé Detrasoft -->
    <footer class="dwa-page-footer">
      <span>Plataforma Segura • Powered by <strong>DetraSoft</strong></span>
    </footer>
  </div>
</div>
